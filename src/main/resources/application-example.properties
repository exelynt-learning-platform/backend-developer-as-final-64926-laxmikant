spring.datasource.url=jdbc:mysql://localhost:3306/resource_booking
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:YOUR_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Set JWT_SECRET environment variable (must be at least 256 bits / 32 bytes long)
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

# Seed user credentials
seed.admin.password=${ADMIN_PASSWORD:admin123}
seed.user.password=${USER_PASSWORD:user123}